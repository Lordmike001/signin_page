<svg viewBox="0 0 1081 608" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"  xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="55%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1384f5"/>
      <stop offset="0.55" stop-color="#0a64cc"/>
      <stop offset="1" stop-color="#054a9e"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4e8ff"/>
      <stop offset="0.5" stop-color="#7fb8fb"/>
      <stop offset="1" stop-color="#3f8ef0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa6f8"/>
      <stop offset="1" stop-color="#1f6fd8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6bd0"/>
      <stop offset="1" stop-color="#0a4aa3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#02265a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1081" height="608" fill="url(#bg)"/>

  <!-- Dark tubes, soft and out of focus -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity="0.9">
    <path d="M640 330 C610 200 640 90 720 85 C790 85 790 180 760 215 C830 190 890 210 880 290 C875 340 905 365 905 385" stroke="#0a4fb0" stroke-width="58"/>
    <path d="M-30 400 C20 360 70 390 60 450 C50 510 110 530 130 600" stroke="#0b57b8" stroke-width="64"/>
    <path d="M60 520 C100 480 170 500 150 560 C140 600 90 610 60 640" stroke="#0a4fb0" stroke-width="50"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#soft)">
    <path d="M650 300 C625 190 650 100 715 95 C770 95 775 170 745 205" stroke="#2a82e8" stroke-width="14" transform="translate(-6 -8)"/>
    <path d="M768 232 C830 212 872 232 866 290" stroke="#2a82e8" stroke-width="12"/>
  </g>

  <!-- Top curl -->
  <g fill="none" stroke-linecap="round" filter="url(#shadow)">
    <path d="M320 -10 C315 25 365 40 385 22" stroke="url(#mid)" stroke-width="34"/>
    <path d="M326 -4 C324 20 355 30 372 18" stroke="#9cc8ff" stroke-width="8" opacity="0.7"/>
  </g>

  <!-- Light zigzag pills, left -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M250 222 L292 190 L318 208 L350 186" stroke="url(#light)" stroke-width="42"/>
    <path d="M250 218 L292 188 L318 205 L350 184" stroke="#ffffff" stroke-width="8" opacity="0.55" filter="url(#soft)"/>
    <path d="M232 292 L262 268 L280 280" stroke="url(#light)" stroke-width="30"/>
    <path d="M232 289 L262 266 L280 277" stroke="#ffffff" stroke-width="6" opacity="0.55" filter="url(#soft)"/>
  </g>

  <!-- Bottom ring + pill -->
  <g fill="none" stroke-linecap="round" filter="url(#shadow)">
    <path d="M410 440 C410 380 350 370 305 400 C265 430 270 470 290 480" stroke="url(#mid)" stroke-width="62"/>
    <path d="M400 430 C395 392 352 385 316 408" stroke="#8cc0ff" stroke-width="12" opacity="0.65" filter="url(#soft)"/>
    <path d="M335 540 C380 540 410 515 405 500" stroke="url(#mid)" stroke-width="44"/>
    <path d="M260 495 L335 480" stroke="url(#mid)" stroke-width="48"/>
    <path d="M262 490 L335 475" stroke="#9cc8ff" stroke-width="8" opacity="0.6" filter="url(#soft)"/>
  </g>

  <!-- Light squiggles, right -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M730 428 C750 418 765 438 785 428 C800 420 808 432 800 438" stroke="url(#light)" stroke-width="22"/>
    <path d="M778 465 C800 455 815 472 835 463 C850 457 856 468 850 472" stroke="url(#light)" stroke-width="24"/>
  </g>

  <!-- Bottom-right blob -->
  <g filter="url(#shadow)">
    <path d="M925 608 C915 545 950 505 1010 520 C1050 530 1075 515 1100 495 L1100 640 Z" fill="url(#mid)"/>
    <path d="M940 560 C950 535 985 525 1015 535" fill="none" stroke="#9cc8ff" stroke-width="6" stroke-linecap="round" opacity="0.55" filter="url(#soft)"/>
  </g>
</svg>